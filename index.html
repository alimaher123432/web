<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خبير البرمجة وتصميم المواقع | AI Assistant</title>
    <style>
        :root { --primary: #007bff; --bg: #0f172a; --panel: #1e293b; --text: #f8fafc; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; height: 100vh; }
        /* Sidebar */
        #sidebar { width: 300px; background: var(--panel); padding: 20px; border-left: 1px solid #334155; }
        #main { flex: 1; display: flex; flex-direction: column; }
        #chat-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .msg { padding: 15px; border-radius: 10px; max-width: 80%; }
        .ai { background: #334155; align-self: flex-start; }
        .user { background: var(--primary); align-self: flex-end; }
        #input-area { padding: 20px; background: var(--panel); display: flex; gap: 10px; }
        input, button { padding: 12px; border-radius: 5px; border: none; }
        input { flex: 1; background: #0f172a; color: white; }
        button { background: var(--primary); color: white; cursor: pointer; }
    </style>
</head>
<body>

    <div id="sidebar">
        <h2>إعدادات الخبير</h2>
        <input type="password" id="apiKey" placeholder="أدخل Google API Key هنا..." style="width: 100%; margin-bottom: 10px;">
        <p style="font-size: 0.8em; color: #94a3b8;">هذا البوت خبير في HTML, CSS, JS, Python, وتصميم الواجهات.</p>
    </div>

    <div id="main">
        <div id="chat-box"></div>
        <div id="input-area">
            <input type="text" id="userInput" placeholder="اطلب مني تصميم موقع أو حل مشكلة برمجية...">
            <button onclick="sendMessage()">إرسال</button>
        </div>
    </div>

    <script>
        async function sendMessage() {
            const input = document.getElementById('userInput');
            const key = document.getElementById('apiKey').value;
            const chatBox = document.getElementById('chat-box');
            
            if (!key) return alert('يرجى إدخال API Key');
            if (!input.value) return;

            // إضافة رسالة المستخدم
            chatBox.innerHTML += `<div class="msg user">${input.value}</div>`;
            const prompt = `أنت خبير في تصميم المواقع ولغات البرمجة. أجب على هذا السؤال بدقة: ${input.value}`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                const data = await response.json();
                const aiText = data.candidates[0].content.parts[0].text;
                chatBox.innerHTML += `<div class="msg ai">${aiText.replace(/\n/g, '<br>')}</div>`;
            } catch (e) {
                chatBox.innerHTML += `<div class="msg ai">خطأ: تأكد من مفتاح الـ API.</div>`;
            }
            input.value = '';
        }
    </script>
</body>
</html>
